[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontofill-containment"
version = "0.1.0"
description = "Run the engine's existing containment fixtures and append their proof to a real run feed"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.scripts]
ontofill-containment = "ontofill_containment.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/ontofill_containment"]

[tool.uv]
# This tool lives inside the engine checkout but is not an engine workspace member: it
# reuses the engine's installed package (see README) and keeps its own lock/venv optional.
workspace-exclude = true

[tool.ruff]
line-length = 100
target-version = "py311"
