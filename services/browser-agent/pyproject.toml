[project]
name = "browser-agent"
version = "0.1.0"
description = "Browser-agent service for Ontofill: inference gateway, MCP controller, native and Skyvern backends"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "mcp>=1.2",
    "playwright>=1.47",
]

[project.scripts]
ba-gateway = "gateway.app:main"
ba-controller = "controller.server:main"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway", "controller", "backends", "shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls real Vultr/Jev endpoints (needs keys; skipped by default)",
           "browser: needs Playwright Chromium"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
