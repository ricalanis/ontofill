# Ontofill Console on the control plane. Bind to loopback or the host's NetBird IP only; NetBird's reverse proxy (SSO,
# approvers group) is the only way in, and it forwards the signed-in user in the identity header.
# A second, read-only instance for public viewing runs from this same file under another project name:
#   ONTOFILL_CONSOLE_IDENTITY=readonly CONSOLE_WRITE_MODE=ro CONSOLE_PORT=8411 docker compose -p ontofill-console-judges ...
name: ontofill-console

services:
  console:
    build: {context: .., dockerfile: Dockerfile}
    image: ontofill-console:local
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # id=/path/in/container[:/local/lake],… ; a case without :lake reads <case parent>/lake.yaml (mounted below)
      ONTOFILL_CONSOLE_CASES: ${ONTOFILL_CONSOLE_CASES:-}
      # CONTRACT v1.0.6: the data-driven registry (<root>/cases.json); paths in it are HOST paths, so the root and any
      # migrated case outside it are mounted at identical paths in the container (the *_CONTAINER_* vars below).
      ONTOFILL_CASES_ROOT: ${CONSOLE_CASES_ROOT:-}
      ONTOFILL_CONSOLE_IDENTITY: ${ONTOFILL_CONSOLE_IDENTITY:-sso-group}   # NetBird Cloud forwards groups, not the user; readonly = viewing only
      ONTOFILL_CONSOLE_GROUPS_HEADER: ${ONTOFILL_CONSOLE_GROUPS_HEADER:-X-NetBird-Groups}
      ONTOFILL_CONSOLE_APPROVER_GROUP: ${ONTOFILL_CONSOLE_APPROVER_GROUP:-approvers}
      ONTOFILL_CONSOLE_DIRECT_DENY: ${ONTOFILL_CONSOLE_DIRECT_DENY:-}   # our own mesh peers' IPs/CIDRs
      ONTOFILL_CONSOLE_PUBLIC_ORIGINS: ${ONTOFILL_CONSOLE_PUBLIC_ORIGINS:-}   # https://<public console host> (CSRF check behind the proxy)
      ONTOFILL_CONSOLE_IDENTITY_HEADER: ${ONTOFILL_CONSOLE_IDENTITY_HEADER:-X-NetBird-User}
      ONTOFILL_CONSOLE_SPEND_HISTORY: /evidence/spend-history.jsonl
      ONTOFILL_CONSOLE_EVIDENCE_DIR: /evidence
      ONTOFILL_RUNNER_GLOBAL_USD: ${ONTOFILL_RUNNER_GLOBAL_USD:-}   # same value as the runner's, for /watch spend vs caps
      ONTOFILL_RUNNER_STATE: /runner   # shared with the ontofill-runner service (R18): control.json, KILL, status
      ONTOFILL_CONSOLE_GATEWAY_LOG: /gateway-log   # R19: the inference gateway's JSONL call log (metadata only), read-only
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
    volumes:
      # Case packages: read-write, because approvals write APPROVED + decisions.jsonl there (and only there).
      # A public viewing instance (ONTOFILL_CONSOLE_IDENTITY=readonly) sets CONSOLE_WRITE_MODE=ro: nothing is writable.
      - ${CONSOLE_CASE_A_HOST_DIR:-../.cache/empty-case}:${CONSOLE_CASE_A_CONTAINER_DIR:-/cases/a/case}:${CONSOLE_WRITE_MODE:-rw}
      - ${CONSOLE_CASE_A_LAKE_YAML:-../.cache/empty-lake.yaml}:${CONSOLE_CASE_A_CONTAINER_LAKE_YAML:-/cases/a/lake.yaml}:ro
      - ${CONSOLE_CASE_B_HOST_DIR:-../.cache/empty-case}:${CONSOLE_CASE_B_CONTAINER_DIR:-/cases/b/case}:${CONSOLE_WRITE_MODE:-rw}
      - ${CONSOLE_CASE_B_LAKE_DIR:-../.cache/empty-lake}:${CONSOLE_CASE_B_CONTAINER_LAKE_DIR:-/cases/b/lake}:ro
      - ${CONSOLE_CASE_B_LAKE_YAML:-../.cache/empty-lake.yaml}:${CONSOLE_CASE_B_CONTAINER_LAKE_YAML:-/cases/b/lake.yaml}:ro
      # the registry root (new cases live here; the console writes cases.json and new case dirs)
      - ${CONSOLE_CASES_ROOT_HOST:-../.cache/empty-cases-root}:${CONSOLE_CASES_ROOT_CONTAINER:-/cases-root}:${CONSOLE_WRITE_MODE:-rw}
      - ${CONSOLE_EVIDENCE_HOST_DIR:-../.cache/empty-evidence}:/evidence:ro
      - ${CONSOLE_RUNNER_STATE_HOST_DIR:-../.cache/empty-runner}:/runner:${CONSOLE_WRITE_MODE:-rw}
      - ${CONSOLE_GATEWAY_LOG_HOST_DIR:-../.cache/empty-gateway-log}:/gateway-log:ro
    ports:
      - "${CONSOLE_BIND_IP:-127.0.0.1}:${CONSOLE_PORT:-8410}:8410"
