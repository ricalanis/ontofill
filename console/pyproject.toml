[project]
name = "ontofill-console"
version = "0.1.0"
description = "Ontofill Console: generic, multi-case runs, approvals and proof for Ontofill case packages"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "pyyaml>=6",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]

[project.scripts]
ontofill-console = "ontofill_console.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "playwright>=1.47", "jsonschema>=4.23", "referencing>=0.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ontofill_console"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ui: headless browser smoke tests (needs Playwright Chromium)"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "BLE", "ISC"]
ignore = ["E501"]  # long lines are ported verbatim from the app's code
