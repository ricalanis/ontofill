[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontofill-scrape"
version = "0.1.0"
description = "Sandbox-scoped extraction tools for Ontofill"
requires-python = ">=3.11"
license = "Apache-2.0"

[tool.hatch.build.targets.wheel]
packages = ["src/ontofill_scrape"]
