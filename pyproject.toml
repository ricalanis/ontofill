[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontofill"
version = "0.1.0"
description = "Evidence-backed public data completion engine"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "beautifulsoup4>=4.12",
  "boto3>=1.35",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "ontofill-scrape",
  "psycopg[binary]>=3.2",
  "pyshacl>=0.30",
  "python-dotenv>=1.2.3",
  "pyyaml>=6.0",
  "rdflib>=7.0",
]

[project.scripts]
ontofill = "ontofill.cli.main:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.12"]

[tool.uv.workspace]
members = ["packages/ontofill-scrape"]

[tool.uv.sources]
ontofill-scrape = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ontofill"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "ontofill/schemas"

[tool.pytest.ini_options]
testpaths = ["tests", "packages/ontofill-scrape/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
